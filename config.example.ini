; ===========================================================================
;  MonitorControls configuration - EXAMPLE
;
;  Detect-Monitors.ps1 writes a real config.ini for your hardware in exactly
;  this shape. This file is only here as a reference for hand-editing.
;
;  Read by BOTH the PowerShell scripts and MonitorControls.ahk, so this is
;  the single place to edit. Values are DECIMAL (ControlMyMonitor takes hex
;  VCP codes but decimal values).
; ===========================================================================

[Paths]
ControlMyMonitor=C:\Tools\ControlMyMonitor\ControlMyMonitor.exe

[Options]
; Show a brief on-screen confirmation when a hotkey fires (1 = yes, 0 = no)
ShowFeedback=1
; Milliseconds to pause between monitors when switching inputs
InputSwitchDelay=250
; Step size for the nudge-brightness hotkeys
NudgeStep=10
; Monitor that Set-Orientation.ps1 and Ctrl+Alt+O rotate by default.
; Check this is really your right-hand screen: .\Set-Orientation.ps1 -List
RotateTarget=Right

[Monitors]
; Every name listed here needs a matching [Monitor.<name>] section below.
Names=Left,Right,Laptop

[Monitor.Left]
Label=DELL U2719D
Type=External
Id=\\.\DISPLAY1\Monitor0
; serial number (usable as Id too): 8VN3D83
;
;   Input source values this monitor reports:
;       15 = DisplayPort-1
;       17 = HDMI-1
;       18 = HDMI-2
;   Active right now (so this is almost certainly the PC): 15 = DisplayPort-1
InputPC=15
;   FILL IN: the value for the port your laptop is plugged into
InputLaptop=17

[Monitor.Right]
Label=LG 27UL650
Type=External
Id=\\.\DISPLAY2\Monitor0
;
;   Input source values this monitor reports:
;       15 = DisplayPort-1
;       17 = HDMI-1
;       18 = HDMI-2
;   Active right now (so this is almost certainly the PC): 17 = HDMI-1
InputPC=17
InputLaptop=18

[Monitor.Laptop]
Label=Built-in laptop screen
; Internal panels do not answer DDC/CI, so this one is driven through WMI
; instead of ControlMyMonitor. It has no input to switch.
Type=Internal

; ===========================================================================
;  Profiles:  <MonitorName>=brightness   or   <MonitorName>=brightness,contrast
;  Leave a monitor out of a profile to leave that monitor untouched.
;  Add your own sections too, e.g. [Profile.Gaming] - the hotkey file and
;  Set-Profile.ps1 -Name Gaming will both pick it up.
; ===========================================================================

[Profile.Day]
Left=75
Right=80
Laptop=70

[Profile.Night]
Left=18
Right=20
Laptop=15

[Profile.Movie]
Left=41,80
Right=44,80
Laptop=35

; A profile for writing code in a dark room. The panel goes to its own
; minimum, then the GPU takes it the rest of the way down.
[Profile.CodeNight]
Left=0
Right=0
Laptop=15

; ===========================================================================
;  [Soft.<profile>] - GPU-level attenuation, applied on top of the profile
;  above. This is how you get BELOW a monitor's own brightness 0, which some
;  panels (the Philips Evnia among them) never get dark enough at.
;
;  Value: brightness[,gamma[,warmth]]
;     brightness  0.05 - 1.0   1.0 = untouched, 0.45 = 45% output
;     gamma       above 1.0 lifts midtones so text stays readable
;     warmth      0 - 1        pulls blue down, like Night Light
;
;  A profile with NO [Soft.*] section clears the ramps, so switching back to
;  Day undoes the dimming automatically.
; ===========================================================================

[Soft.CodeNight]
Left=0.45,1.15,0.35
Right=0.60,1.10,0.30

[Soft.Night]
Left=0.65,1.05,0.25
Right=0.75,1.05,0.20
