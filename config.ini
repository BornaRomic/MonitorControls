; ===========================================================================
;  MonitorControls configuration
;  Generated on DESKTOP-IL39TVN at 2026-09-13 22:21 by Detect-Monitors.ps1
;
;  Read by BOTH the PowerShell scripts and MonitorControls.ahk, so this is
;  the single place to edit. Values are DECIMAL (ControlMyMonitor takes hex
;  VCP codes but decimal values).
; ===========================================================================

[Paths]
ControlMyMonitor=C:\Tools\ControlMyMonitor\ControlMyMonitor.exe

[Options]
; Show a brief on-screen confirmation when a hotkey fires (1 = yes, 0 = no)
ShowFeedback=1
; Milliseconds to pause between monitors when switching inputs
InputSwitchDelay=250
; Step size for the nudge-brightness hotkeys
NudgeStep=10
; Monitor that Set-Orientation.ps1 and Ctrl+Alt+O rotate by default.
; Check this is really your right-hand screen: .\Set-Orientation.ps1 -List
RotateTarget=Right

[Monitors]
; Every name listed here needs a matching [Monitor.<name>] section below.
Names=Left,Right

[Monitor.Left]
Label=Left
Type=External
;   Stable identity. This is what every script keys on - it is burned
;   into the panel and survives reboots, re-cabling and GPU changes.
MonitorKey=PHLC323
Serial=
;   Windows display number at the time of detection. VOLATILE - Windows
;   renumbers these at boot. Kept only as a fallback; nothing breaks
;   when it goes stale.
Id=\\.\DISPLAY1\Monitor0

;   Input source values this monitor reports:
;       15 = DisplayPort-1
;       17 = HDMI-1
;       18 = HDMI-2
;       33 = unknown (dec 33 / hex 0x21)
;       34 = unknown (dec 34 / hex 0x22)
;       47 = unknown (dec 47 / hex 0x2F)
;   Active right now (so this is almost certainly the PC): 15 = DisplayPort-1
InputPC=15
;   FILL IN: the value for the port your laptop is plugged into
InputLaptop=

;   VCP 14, picture presets. Only these values are accepted.
;   The tuner (Ctrl+Alt+T) shows a preset row for this monitor;
;   delete the line to hide that row.
Presets=2:Display native,4:5000K,5:6500K,6:7500K,7:8200K,8:9300K,11:User 1,13:User 3

[Monitor.Right]
Label=DELL S3220DGF
Type=External
;   Stable identity. This is what every script keys on - it is burned
;   into the panel and survives reboots, re-cabling and GPU changes.
MonitorKey=DELD0F4
Serial=3XGSF43
;   Windows display number at the time of detection. VOLATILE - Windows
;   renumbers these at boot. Kept only as a fallback; nothing breaks
;   when it goes stale.
Id=\\.\DISPLAY2\Monitor0

;   Input source values this monitor reports:
;       15 = DisplayPort-1
;       17 = HDMI-1
;       18 = HDMI-2
;   Active right now (so this is almost certainly the PC): 15 = DisplayPort-1
InputPC=15
;   FILL IN: the value for the port your laptop is plugged into
InputLaptop=

;   VCP 14, picture presets. Only these values are accepted.
;   The tuner (Ctrl+Alt+T) shows a preset row for this monitor;
;   delete the line to hide that row.
Presets=5:6500K,8:9300K,11:User 1,12:User 2

; ===========================================================================
;  Profiles:  <MonitorName>=brightness   or   <MonitorName>=brightness,contrast
;  Leave a monitor out of a profile to leave that monitor untouched.
;  Add your own sections too, e.g. [Profile.Gaming] - the hotkey file and
;  Set-Profile.ps1 -Name Gaming will both pick it up.
; ===========================================================================

[Profile.Day]
Left=20
Right=12

[Profile.Night]
Left=5
Right=3

[Profile.Movie]
