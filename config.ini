; ===========================================================================
;  MonitorControls configuration
;
;  Read by BOTH the PowerShell scripts and MonitorControls.ahk, so this is
;  the single place to edit. Values are DECIMAL (ControlMyMonitor takes hex
;  VCP codes but decimal values).
;
;  Monitors are identified by MonitorKey - the EDID hardware id burned into
;  the panel. Windows renumbers \\.\DISPLAYn at every boot (yours went from
;  DISPLAY5/6 to DISPLAY9/10), so nothing keys on those any more.
; ===========================================================================

[Paths]
ControlMyMonitor=C:\Tools\ControlMyMonitor\ControlMyMonitor.exe

[Options]
; Show a brief on-screen confirmation when a hotkey fires (1 = yes, 0 = no)
ShowFeedback=1
; Milliseconds to pause between monitors when switching inputs
InputSwitchDelay=250
; Step size for the nudge-brightness hotkeys
NudgeStep=10
; Monitor that Set-Orientation.ps1 and Ctrl+Alt+O rotate by default.
RotateTarget=Right

; ---------------------------------------------------------------------------
;  Cross-fade. Profiles ease in instead of snapping.
;
;  The GPU gamma part fades smoothly at 40 fps. The panel's own brightness
;  cannot - each DDC/CI call costs 50-150 ms - so it moves in FadeDdcSteps
;  coarse steps underneath. FadeMs=0 restores the old instant switch.
; ---------------------------------------------------------------------------
FadeMs=450
FadeDdcSteps=4

; ---------------------------------------------------------------------------
;  Apply a profile automatically at a time of day.
;
;      AutoProfile=Day@07:30, CodeNight@20:30
;      AutoProfile=Day@sunrise, Night@sunset-30
;
;  sunrise/sunset are computed from Latitude/Longitude below - no network, no
;  API key. Longitude is positive EAST. Find yours on any map site.
;
;  Whichever entry is in force when the script starts is applied immediately,
;  so launching in the evening lands on the evening profile. Choosing a profile
;  by hand parks the schedule until the next entry is due, so it never fights
;  you. Toggle it any time from the tray.
;
;  Off until you uncomment it.
; ---------------------------------------------------------------------------
;AutoProfile=Day@07:30, CodeNight@20:30
Latitude=
Longitude=

; ---------------------------------------------------------------------------
;  Dim the screens you are NOT working on (Ctrl+Alt+F, or the tray).
;
;  0 = off. Otherwise the output level the unfocused screens drop to, 0.05-1.0.
;  This stacks with the profile: a CodeNight screen already at 45% goes to
;  45% x 0.6 when it is not the one you are looking at.
;
;  The hotkey turns it on at 0.45 without editing anything, so leaving this at
;  0 does not put the feature out of reach. FocusDimDelay is how long a window
;  has to hold focus before the others dim - it stops alt-tabbing from
;  strobing the desk.
; ---------------------------------------------------------------------------
FocusDim=0
FocusDimDelay=600

; ---------------------------------------------------------------------------
;  Dim everything after a spell with no keyboard or mouse.
;
;  IdleDimAfter is in SECONDS; 0 = off. Also stacks with the profile, and with
;  focus dim. Slow on the way down, quick on the way back. The tray toggle
;  turns it on at 300 s without editing anything.
; ---------------------------------------------------------------------------
IdleDimAfter=0
IdleDimLevel=0.35
IdleDimFadeMs=1500

[Monitors]
; Every name listed here needs a matching [Monitor.<name>] section below.
Names=Left,Right,Laptop

; ---------------------------------------------------------------------------
;  LEFT  = Philips Evnia, 3840x2160, the primary display (desktop x=0)
; ---------------------------------------------------------------------------
[Monitor.Left]
Label=Philips Evnia
Type=External
;   Stable identity. Burned into the panel; survives reboots and re-cabling.
MonitorKey=PHLC323
Serial=
;   Windows display number as last seen. VOLATILE - fallback only.
Id=\\.\DISPLAY9\Monitor0

;   Input source values this monitor reports:
;       15 = DisplayPort-1
;       17 = HDMI-1
;       18 = HDMI-2
;       33 = unknown (dec 33 / hex 0x21)
;       34 = unknown (dec 34 / hex 0x22)
;       47 = unknown (dec 47 / hex 0x2F)
InputPC=15
InputLaptop=18

;   Extras this panel reports, from detected\vcp_2_*.csv. The tuner
;   (Ctrl+Alt+T) shows a row for each; delete a line to hide that row.
;     VCP 62, monitor speaker volume
Volume=1
;     VCP 14, picture presets. Only these values are accepted.
Presets=2:Display native,4:5000K,5:6500K,6:7500K,7:8200K,8:9300K,11:User 1,13:User 3

; ---------------------------------------------------------------------------
;  RIGHT = DELL S3220DGF, 2560x1440, sits at desktop x=3840
; ---------------------------------------------------------------------------
[Monitor.Right]
Label=DELL S3220DGF
Type=External
;   Stable identity. Burned into the panel; survives reboots and re-cabling.
MonitorKey=DELD0F3
Serial=3XGSF43
;   Windows display number as last seen. VOLATILE - fallback only.
Id=\\.\DISPLAY10\Monitor0

;   Input source values this monitor reports:
;       15 = DisplayPort-1
;       17 = HDMI-1
;       18 = HDMI-2
InputPC=15
InputLaptop=18

;   Extras this panel reports, from detected\vcp_3_*.csv.
;     VCP 62, monitor speaker volume
Volume=1
;     VCP 14, picture presets. Only these values are accepted.
Presets=5:6500K,8:9300K,11:User 1,12:User 2

; ---------------------------------------------------------------------------
;  LAPTOP = built-in panel, Intel UHD, 2560x1600
; ---------------------------------------------------------------------------
[Monitor.Laptop]
Label=Built-in laptop screen
; Internal panels do not answer DDC/CI, so this one is driven through WMI
; instead of ControlMyMonitor. It has no input to switch.
Type=Internal
MonitorKey=BOE0C8B

; ===========================================================================
;  Profiles:  <MonitorName>=brightness   or   <MonitorName>=brightness,contrast
;  Leave a monitor out of a profile to leave that monitor untouched.
;  Add your own sections too, e.g. [Profile.Gaming] - the hotkey file and
;  Set-Profile.ps1 -Name Gaming will both pick it up.
; ===========================================================================

[Profile.Day]
Left=20
Right=45
Laptop=80

[Profile.Night]
Left=10
Right=15
Laptop=40

[Profile.Movie]
Left=28,55
Right=16,80
Laptop=44

; A profile for writing code in a dark room. The panel goes to its own
; minimum, then the GPU takes it the rest of the way down.
[Profile.CodeNight]
Left=0
Right=0
Laptop=15

; ===========================================================================
;  [Soft.<profile>] - GPU-level attenuation, applied on top of the profile
;  above. This is how you get BELOW a monitor's own brightness 0, which some
;  panels (the Philips Evnia among them) never get dark enough at.
;
;  Value: brightness[,gamma[,warmth]]
;     brightness  0.05 - 1.0   1.0 = untouched, 0.45 = 45% output
;     gamma       above 1.0 lifts midtones so text stays readable
;     warmth      0 - 1        pulls blue down, like Night Light
;
;  A profile with NO [Soft.*] section clears the ramps, so switching back to
;  Day undoes the dimming automatically.
; ===========================================================================

[Soft.CodeNight]
Left=0.45,1.15,0.35
Right=0.60,1.10,0.30

[Soft.Night]
Left=0.65,1.05,0.25
Right=0.75,1.05,0.20
